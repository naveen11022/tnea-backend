name: CI/CD - Docker + Render

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:

  test:
    name: Test and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          

  docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build \
            --platform linux/amd64 \
            -t "${{ secrets.DOCKER_USERNAME }}/fastapi-cicd:latest" \
            -t "${{ secrets.DOCKER_USERNAME }}/fastapi-cicd:${{ github.sha }}" \
            .

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/fastapi-cicd:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push latest image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/fastapi-cicd:latest

      - name: Push versioned image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/fastapi-cicd:${{ github.sha }}


  deploy:
    name: Deploy to Render
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}&imgURL=docker.io/${{ secrets.DOCKER_USERNAME }}/fastapi-cicd:${{ github.sha }}"
